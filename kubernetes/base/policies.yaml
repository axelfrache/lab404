apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: require-image-digest
  namespace: lab404
  labels:
    app.kubernetes.io/part-of: lab404
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: images
      expression: >-
        object.spec.containers.map(c, c.image)
        + (has(object.spec.initContainers) ? object.spec.initContainers.map(c, c.image) : [])
        + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers.map(c, c.image) : [])
  validations:
    - expression: variables.images.all(image, image.matches('@sha256:[a-f0-9]{64}$'))
      messageExpression: >-
        'Images must be pinned by digest: ' +
        variables.images.filter(image, !image.matches('@sha256:[a-f0-9]{64}$')).join(', ')
---
apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: require-image-digest-ephemeral
  namespace: lab404
  labels:
    app.kubernetes.io/part-of: lab404
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
  variables:
    - name: images
      expression: >-
        object.spec.containers.map(c, c.image)
        + (has(object.spec.initContainers) ? object.spec.initContainers.map(c, c.image) : [])
        + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers.map(c, c.image) : [])
  validations:
    - expression: variables.images.all(image, image.matches('@sha256:[a-f0-9]{64}$'))
      messageExpression: >-
        'Images must be pinned by digest: ' +
        variables.images.filter(image, !image.matches('@sha256:[a-f0-9]{64}$')).join(', ')
