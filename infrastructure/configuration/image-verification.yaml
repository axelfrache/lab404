apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-application-images
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  validationConfigurations:
    mutateDigest: false
    required: true
    verifyDigest: true
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: lab404
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  matchImageReferences:
    - glob: ghcr.io/axelfrache/lab404-web*
    - glob: ghcr.io/axelfrache/lab404-votes*
  attestors:
    - name: workflow
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subject: https://github.com/axelfrache/lab404/.github/workflows/images.yml@refs/heads/main
  validations:
    - expression: >-
        (images.containers + images.initContainers + images.ephemeralContainers)
        .map(image, verifyImageSignatures(image, [attestors.workflow]))
        .all(count, count > 0)
      message: Application images must be signed by the lab404 images workflow.
